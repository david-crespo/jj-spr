query PullRequestMergeabilityQuery(
  $name: String!
  $owner: String!
  $number: Int!
) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      state
      baseRefName
      headRefOid
      mergeable
      mergeStateStatus
      mergeCommit {
        oid
      }
    }
  }
}
